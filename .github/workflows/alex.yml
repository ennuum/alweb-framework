# Intégration continue GitHub Actions pour alweb (généré par alexc new).
name: alex
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer ALEX
        run: |
          curl -fsSL "$ALEX_DIST_URL" -o alex.tar.gz || { echo "Définissez la variable ALEX_DIST_URL (archive .tar.gz de make package)"; exit 1; }
          mkdir -p "$HOME/alex" && tar -xzf alex.tar.gz -C "$HOME/alex" --strip-components=1
          echo "$HOME/alex/bin" >> "$GITHUB_PATH"
        env:
          ALEX_DIST_URL: ${{ vars.ALEX_DIST_URL }}
      - name: Vérifier la mise en forme
        run: alexc fmt --check .
      - name: Tests
        run: alexc test --json . | tee resultats-tests.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-tests
          path: resultats-tests.jsonl
