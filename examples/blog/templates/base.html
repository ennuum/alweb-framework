<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}{{ app_name }}{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1><a href="/">{{ app_name }}</a></h1>
  <nav>
  {% if current_user %}
    {{ current_user.nom }} · <a href="/ecrire">Écrire</a>
    <form method="post" action="/deconnexion">{{ csrf_field() }}<button>Se déconnecter</button></form>
  {% else %}
    <a href="/connexion">Connexion</a> · <a href="/inscription">Inscription</a>
  {% endif %}
  </nav>
</header>
{% for f in flashes() %}
<p class="flash {{ f.category }}">{{ f.message }}</p>
{% endfor %}
<main>
{% block contenu %}{% endblock %}
</main>
</body>
</html>
