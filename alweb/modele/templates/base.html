<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}{{ app_name }}{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1><a href="{{ url_for('accueil') }}">{{ app_name }}</a></h1>
</header>
{% for f in flashes() %}
<p class="flash {{ f.category }}">{{ f.message }}</p>
{% endfor %}
<main>
{% block contenu %}{% endblock %}
</main>
<footer>Propulsé par alweb</footer>
</body>
</html>
